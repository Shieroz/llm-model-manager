networks:
  llama-net:

services:
  llm-model-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/llm-model-manager:latest
    container_name: llm-model-manager
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # - LOG_LEVEL=DEBUG # Uncomment for verbose logging
    ports:
      - "8000:8000"
    volumes:
      - ${MODELS}:/models
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  llama-swap:
    build:
      context: .
      dockerfile: ${LLAMA_DOCKERFILE:-Dockerfile.llama.cuda}
      args:
        # Single source of truth for the llama.cpp version across all backends.
        # Bump here (or override in .env) to rebuild against a newer commit;
        # changing it busts the cached git-clone layer. 6fe7498 has MTP
        # (PR #22673) plus the ngram-mod drafter used by the Qwen3.8 configs.
        # See README "Performance Tuning" for the flags these builds expect.
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-6fe7498}
    image: local/llama-swap:${LLAMA_BACKEND:-cuda}
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - llama-net
    volumes:
      - ${MODELS}:/models
    command: --config /models/served/config.yaml